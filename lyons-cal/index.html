<style id="css">
  :root{
    --paper:#F6F7F4; --card:#FFFFFF; --ink:#1D2833; --haze:#5C6873;
    --line:#DDE2DE; --rink:#24486E; --rink-soft:#E3EAF3;
    --flare:#C43B3B; --flare-soft:#F7E4E2;
    --field:#3E7A4E; --field-soft:#E4EEE4;
    --trail:#A9782F; --trail-soft:#F3EAD8;
    --today:#24486E; --chipink:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141B23; --card:#1C242E; --ink:#E8ECEF; --haze:#93A0AB;
      --line:#2C3743; --rink:#7FA8D4; --rink-soft:#243447;
      --flare:#E07B72; --flare-soft:#3D2626;
      --field:#7FB88C; --field-soft:#22332A;
      --trail:#D9B36A; --trail-soft:#3A3226;
      --today:#7FA8D4; --chipink:#141B23;
    }
  }
  :root[data-theme="dark"]{
    --paper:#141B23; --card:#1C242E; --ink:#E8ECEF; --haze:#93A0AB;
    --line:#2C3743; --rink:#7FA8D4; --rink-soft:#243447;
    --flare:#E07B72; --flare-soft:#3D2626;
    --field:#7FB88C; --field-soft:#22332A;
    --trail:#D9B36A; --trail-soft:#3A3226;
    --today:#7FA8D4; --chipink:#141B23;
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0}
  h1,h2,h3,p,ul{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.55;
  }
  .wrap{max-width:920px; margin:0 auto; padding:28px 18px 64px}
  a{color:var(--rink); text-decoration-thickness:1px; text-underline-offset:2px}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--rink); outline-offset:2px; border-radius:2px}

  .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--haze); font-weight:600}
  h1{
    font-family:"Zilla Slab","Rockwell",serif; font-weight:700;
    font-size:clamp(34px,6vw,48px); line-height:1.05; margin:6px 0 10px; text-wrap:balance;
  }
  .sub{color:var(--haze); max-width:60ch; margin:0 0 14px}
  .linkrow{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:14px; padding:12px 0 4px; border-top:1px solid var(--line)}
  header{margin-bottom:26px}
  h2{font-family:"Zilla Slab","Rockwell",serif; font-weight:600; font-size:24px; margin:0 0 4px; text-wrap:balance}
  h3{font-family:"Zilla Slab",serif; font-weight:600}
  .h2row{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:36px 0 12px}
  .h2row .note{color:var(--haze); font-size:13.5px}

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:14px; font-weight:600;
    padding:10px 18px; border-radius:24px; box-shadow:0 4px 18px rgba(0,0,0,.25); z-index:50;
  }

  .nextup{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px}
  .nu{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:3px}
  .nu .when{font-size:12.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--haze)}
  .nu .what{font-weight:600; font-size:15px; line-height:1.3}
  .nu .meta{font-size:13px; color:var(--haze)}
  .nu .rel{font-size:12.5px; font-weight:700; margin-top:4px}
  .nu.c-show .rel,.nu.c-pay .rel{color:var(--flare)}
  .nu.c-practice .rel,.nu.c-skate .rel{color:var(--rink)}
  .nu.c-school .rel{color:var(--field)}
  .nu.c-travel .rel{color:var(--trail)}
  .nu.today-card{border-color:var(--today); box-shadow:0 0 0 1px var(--today) inset}

  .legend{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:13px; color:var(--haze); margin:14px 0 6px; align-items:center}
  .key{display:inline-flex; align-items:center; gap:6px}
  .swatch{width:12px; height:12px; border-radius:3px; flex:none}
  .sw-school{background:var(--field-soft); border:1px solid var(--field)}
  .sw-practice{background:var(--rink)}
  .sw-skate{background:transparent; border:2px solid var(--rink); border-radius:50%; width:10px; height:10px}
  .sw-show{background:var(--flare)}
  .sw-pay{background:transparent; border:2px solid var(--flare); border-radius:50%; width:10px; height:10px}
  .sw-travel{background:var(--trail)}

  .month{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin:16px 0}
  .month h3{font-size:20px; margin:0 0 12px}
  .mbody{display:grid; grid-template-columns:minmax(280px,340px) 1fr; gap:8px 26px}
  @media (max-width:640px){ .mbody{grid-template-columns:1fr} }
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; align-self:start}
  .dow{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--haze); text-align:center; padding-bottom:3px; font-weight:600}
  .cell{
    position:relative; min-height:42px; border-radius:6px; padding:3px 0 12px;
    text-align:center; font-variant-numeric:tabular-nums; font-size:13px; font-weight:500;
    background:var(--paper);
  }
  .cell.blank{background:transparent}
  .cell.off{background:var(--field-soft); color:var(--field); font-weight:700}
  .cell.showday{background:var(--flare-soft)}
  .cell.today{outline:2px solid var(--today); outline-offset:-2px; font-weight:700}
  .dots{position:absolute; left:0; right:0; bottom:4px; display:flex; gap:3px; justify-content:center}
  .dot{width:7px; height:7px; border-radius:50%}
  .d-practice{background:var(--rink)}
  .d-skate{background:transparent; border:2px solid var(--rink); width:5px; height:5px}
  .d-pay{background:transparent; border:2px solid var(--flare); width:5px; height:5px}
  .d-travel{background:var(--trail)}
  .d-family{background:var(--haze)}
  .sw-family{background:var(--haze)}
  .band{position:absolute; left:2px; right:2px; bottom:0; height:4px; border-radius:2px; background:var(--flare)}
  .mlist{padding:0; list-style:none; font-size:14px; display:flex; flex-direction:column; gap:7px; align-self:start}
  .mlist li{display:flex; gap:10px; align-items:baseline}
  .mlist .md{flex:none; width:64px; font-weight:700; font-variant-numeric:tabular-nums; font-size:13px}
  .mlist .c-practice .md,.mlist .c-skate .md{color:var(--rink)}
  .mlist .c-show .md,.mlist .c-pay .md{color:var(--flare)}
  .mlist .c-school .md{color:var(--field)}
  .mlist .c-travel .md{color:var(--trail)}
  .mlist .c-family .md{color:var(--haze)}
  .nu.c-family .rel{color:var(--haze)}
  .mlist .tt{line-height:1.4}
  .mlist .tt small{color:var(--haze); display:block; font-size:12.5px}

  .shows{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px}
  .show{background:var(--card); border:1px solid var(--line); border-top:4px solid var(--flare); border-radius:10px; padding:14px 16px}
  .show .dates{font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--flare)}
  .show h3{font-size:20px; margin:2px 0 8px}
  .show p{margin:6px 0; font-size:14px}
  .show .hotel{border-top:1px dashed var(--line); margin-top:10px; padding-top:8px; font-size:13.5px}
  .tag{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:1px 8px; border-radius:20px; margin-left:6px}
  .tag.ok{background:var(--field); color:var(--chipink)}
  .tag.tbd{background:var(--flare-soft); color:var(--flare)}
  .tag.plan{background:var(--trail-soft); color:var(--trail)}
  .tag.new{background:var(--rink); color:var(--chipink)}
  .tag.done{background:var(--field-soft); color:var(--field)}

  .travel{border-top-color:var(--trail)}
  .travel .dates{color:var(--trail)}
  .verify{
    font:inherit; font-size:13px; font-weight:700; color:var(--trail);
    background:var(--trail-soft); border:1.5px solid var(--trail); border-radius:8px;
    padding:6px 12px; cursor:pointer; margin-top:10px;
  }

  .plain{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 20px}
  .plain ul{margin:8px 0 0; padding-left:20px}
  .plain li{margin:6px 0; font-size:14.5px}

  .rail{display:flex; flex-direction:column}
  .r-item{display:flex; gap:14px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px; align-items:baseline}
  .r-item:last-child{border-bottom:none}
  .r-when{flex:none; width:132px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--field); font-size:13.5px}
  .r-what small{color:var(--haze); display:block; font-size:12.5px}
  .r-item.exam .r-when{color:var(--rink)}

  /* submit form */
  .formcard{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px}
  .fgrid{display:grid; gap:12px}
  .flabel{font-size:12.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--haze); margin-bottom:5px; display:block}
  .who{display:flex; gap:8px; flex-wrap:wrap}
  .who button{
    font:inherit; font-size:14px; font-weight:600; color:var(--ink);
    background:var(--paper); border:1.5px solid var(--line); border-radius:22px; padding:6px 16px; cursor:pointer;
  }
  .who button[aria-pressed="true"]{background:var(--rink); border-color:var(--rink); color:var(--chipink)}
  .frow{display:flex; gap:12px; flex-wrap:wrap}
  .frow > div{flex:1 1 160px}
  select,input[type="date"],input[type="file"],textarea{
    font:inherit; font-size:14.5px; color:var(--ink); background:var(--paper);
    border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; width:100%;
  }
  input[type="file"]{font-size:13.5px}
  .rphoto{display:block; max-width:100%; max-height:220px; border-radius:8px; margin-top:8px; border:1px solid var(--line)}
  textarea{min-height:74px; resize:vertical}
  .send{
    font:inherit; font-size:15px; font-weight:700; color:var(--chipink); background:var(--rink);
    border:none; border-radius:8px; padding:10px 22px; cursor:pointer; justify-self:start;
  }
  .send[disabled]{opacity:.55; cursor:default}
  .fnote{font-size:13px; color:var(--haze)}
  .fnote strong{color:var(--ink)}
  .formmsg{font-size:14px; font-weight:600}
  .formmsg.err{color:var(--flare)}

  .inbox{display:flex; flex-direction:column; gap:10px}
  .req{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:14px}
  .req .rhead{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:3px}
  .req .rwho{font-weight:700}
  .req .rmeta{color:var(--haze); font-size:12.5px}
  .req .rtext{line-height:1.45}

  footer{margin-top:44px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--haze); line-height:1.7}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

/* ---------- verify a trip: flag it on the board + draft the work email ---------- */
function wireVerify(){
  document.getElementById('app').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-verify]'); if(!b) return;
    var i = +b.getAttribute('data-verify');
    var t = state.travel[i]; if(!t) return;
    var subj = 'Travel dates confirmed — Michael out ' + t.dates;
    var body = 'Matt,\n\nConfirming my out-of-Permian dates: ' + t.dates + ' (' + t.title + ').\n' +
      'Cell and email the whole way, dispatch covered remotely as usual — flag anything that needs ' +
      'in-person coverage before I head out.\n\nMike';
    location.href = 'mailto:' + WORK + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
    if (artifactNS && !readOnly){
      var ns = JSON.parse(JSON.stringify(state));
      ns.travel[i].status = 'verified';
      try { sessionStorage.setItem('famcal-verified', t.dates); } catch(e){}
      artifactNS.publish(buildDoc(ns)).catch(function(){ /* conflict: view reloads to winner; re-tap Verify */ });
    }
  });
}

/* ---------- submit ---------- */
var picked = '';
function wireForm(){
  var whoRow = document.getElementById('whoRow');
  whoRow.addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-who]'); if(!b) return;
    picked = b.getAttribute('data-who');
    whoRow.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); });
  });
  var vDone = null;
  try { vDone = sessionStorage.getItem('famcal-verified'); sessionStorage.removeItem('famcal-verified'); } catch(e){}
  if (vDone){ toast('Trip ' + vDone + ' verified — work email drafted.'); }
  var draft = null;
  try { draft = JSON.parse(sessionStorage.getItem('famcal-draft')||'null'); } catch(e){}
  if (draft){
    var landed = state.requests.some(function(r){ return r.id === draft.id; });
    sessionStorage.removeItem('famcal-draft');
    if (landed){ toast('On the board — everyone sees it now.'); }
    else {
      picked = draft.who;
      whoRow.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x.getAttribute('data-who')===draft.who)); });
      document.getElementById('fcat').value = draft.cat;
      document.getElementById('fdate').value = draft.date||'';
      document.getElementById('ftext').value = draft.text;
      msg('Someone updated the board first — your note is still here, send it again' +
          (draft.photoName ? ' (re-attach the photo).' : '.'), true);
    }
  }
  document.getElementById('reqform').addEventListener('submit', onSubmit);
}
function msg(t, isErr){
  var el = document.getElementById('formMsg');
  el.textContent = t; el.className = 'formmsg'+(isErr?' err':'');
}
function toast(t){
  var el = document.createElement('div'); el.className='toast'; el.textContent=t;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 5000);
}
function mailtoFallback(req){
  var subj = 'FAMILY CAL: '+req.cat+' — from '+req.who;

  msg('Opening email instead — send it and the sweep picks it up tonight.');

  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function(){
    URL.revokeObjectURL(url);
    var w = img.naturalWidth, h = img.naturalHeight, out = null;
    var shrink = function(maxDim, q){
      var s = Math.min(1, maxDim / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w*s)); cv.height = Math.max(1, Math.round(h*s));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      return cv.toDataURL('image/jpeg', q);
    };
    try {
      out = shrink(1400, 0.72);
      if (out.length > 900000) out = shrink(1000, 0.55);
    } catch(e){ out = null; }
    cb(out && out.length <= 900000 ? out : null);
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}
function onSubmit(ev){
  ev.preventDefault();
  var text = document.getElementById('ftext').value.trim();
  if (!picked){ msg('Pick a name first.', true); return; }
  if (!text){ msg('Say what should change.', true); return; }
  var req = {
    id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    who: picked,
    cat: document.getElementById('fcat').value,
    date: document.getElementById('fdate').value || '',
    text: text,
    ts: new Date().toLocaleDateString('en-CA', {month:'short', day:'numeric'}),
    status: 'new'
  };
  var fEl = document.getElementById('fphoto');
  var file = fEl && fEl.files && fEl.files[0];
  if (readOnly || !artifactNS){
    mailtoFallback(req);
    if (file){ msg('Photos can’t ride this link. Easiest: open Photos, pick the shot, Share → Mail it to '+MAILTO+' with FAMILY CAL in the subject. Or in the draft that just opened: long-press in the body → Insert Photo.', true); }
    return;
  }
  if (file){
    msg('Shrinking photo…');
    compressImage(file, function(photo){
      if (!photo){ msg('That photo wouldn’t shrink enough — email it with FAMILY CAL in the subject instead.', true); return; }
      var total = photo.length;
      state.requests.forEach(function(r){ if (r.photo) total += r.photo.length; });
      if (total > 6000000){ msg('The board’s photo box is full — email this one; the sweep clears space nightly.', true); return; }
      req.photo = photo; req.photoName = file.name;
      doPublish(req);
    });
  } else {
    doPublish(req);
  }
}
function doPublish(req){
  var btn = document.getElementById('sendBtn');
  btn.disabled = true; msg('Saving to the board…');
  var newState = JSON.parse(JSON.stringify(state));
  newState.requests.push(req);
  try {
    var draftCopy = {}; for (var k in req){ if (k !== 'photo') draftCopy[k] = req[k]; }
    sessionStorage.setItem('famcal-draft', JSON.stringify(draftCopy));
  } catch(e){}
  artifactNS.publish(buildDoc(newState)).then(function(){
    /* success: this view reloads to the new version; draft check shows the toast */
  }).catch(function(err){
    var code = err && err.code;
    if (code === 'conflict'){ return; /* view reloads to winner; draft restores the note */ }
    btn.disabled = false;
    try { sessionStorage.removeItem('famcal-draft'); } catch(e){}
    if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' ||
        code === 'capability_disabled' || code === 'capability_removed' || code === 'consent_required'){
      readOnly = true;
      document.getElementById('modeNote').innerHTML =
        'This view can&rsquo;t write to the board, so suggestions go by email to <strong>'+MAILTO+'</strong> '+
        'with <strong>FAMILY CAL</strong> in the subject &mdash; the nightly sweep reads those too.';
      mailtoFallback(req);
    } else if (code === 'rate_limited'){
      msg('Too many saves at once — wait a minute and try again.', true);
    } else {
      msg('Couldn&rsquo;t save just now — try again, or use email.', true);
    }
  });
}

/* ---------- self-publish document template ---------- */
function buildDoc(st){
  var css = document.getElementById('css').textContent;
  var code = document.getElementById('app-script').textContent;
  var json = JSON.stringify(st, null, 1).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
    '<title>Lyons Family Calendar</title>\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">\n' +
    '<style id="css">' + css + '</style>\n</head>\n<body>\n<div id="app"></div>\n' +
    '<script type="application/json" id="state">' + json + '</scr' + 'ipt>\n' +
    '<script id="app-script">' + code + '</scr' + 'ipt>\n</body>\n</html>';
}

render();

if (window.claude && window.claude.use){
  window.claude.use('artifact').then(function(ns){ artifactNS = ns; });
} else {
  readOnly = true;
  var mn = document.getElementById('modeNote');
  if (mn){ mn.innerHTML = 'From this view, suggestions go by email: tap the button and your mail app opens '+
    'pre&#8209;addressed to <strong>'+MAILTO+'</strong> &mdash; hit send and the nightly sweep boards it. '+
    '<strong>Sending a photo?</strong> The reliable way: open <strong>Photos</strong>, pick the shot, '+
    'Share &rarr; Mail, address it to '+MAILTO+' with <strong>FAMILY CAL</strong> in the subject. '+
    '(In a draft, you can also long&#8209;press in the body &rarr; Insert Photo.)'; }
}
})();
</script>
