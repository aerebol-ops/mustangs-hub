*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{

}
@media (prefers-color-scheme:dark){:root{
  --ground:#0C131A; --panel:#131C25; --sunk:#0F1922;
  --ink:#E9EEF3; --ink2:#A7B5C3; --ink3:#7C8B9A;
  --line:#243141; --line2:#2F3F4F;
  --accent:#E5952F; --accent2:#F2B978; --accentWash:#2A2015;

  --shadow:rgba(0,0,0,.45);

body{background:var(--ground);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0;background:url(mustangs-logo.png) center 34%/min(74vmin,36rem) no-repeat;opacity:.055;pointer-events:none;z-index:0}
#app{max-width:52rem;margin:0 auto;padding:1.25rem 1rem 5rem;position:relative;z-index:1}
.crest{width:clamp(68px,17vw,104px);height:auto;filter:drop-shadow(0 2px 6px var(--shadow))}
h1,h2,.eyebrow,th,.btnlink{font-family:var(--sans)}
h1{font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
h2{font-size:.82rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0;padding-bottom:.5rem;border-bottom:2px solid var(--line)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:2.25rem}
.sec{display:flex;flex-direction:column;gap:.9rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mast{display:grid;grid-template-columns:1fr auto;gap:.55rem 1.25rem;align-items:center;padding-bottom:1.1rem;border-bottom:3px solid var(--ink)}
.mast .mtxt{display:flex;flex-direction:column;gap:.55rem}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.sub{color:var(--ink2);font-size:.95rem}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(12.5rem,1fr));gap:.7rem}
.gt{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.3rem;box-shadow:0 1px 2px var(--shadow)}
.gt.c-ice{border-left-color:var(--ice)}
.gt.c-money{border-left-color:var(--good)}
.gt.c-road{border-left-color:var(--far)}
.gt .gk{font-family:var(--sans);font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.gt .gv{font-family:var(--sans);font-weight:700;font-size:1rem;line-height:1.4}
.gt .gs{font-size:.78rem;color:var(--ink3);font-family:var(--sans);line-height:1.45}
.btnlink{display:inline-block;background:var(--ink);color:var(--ground);text-decoration:none;font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:.65rem 1rem}
.btnlink:hover{opacity:.85}
.cards{display:flex;flex-direction:column;gap:.7rem}
.card{display:grid;grid-template-columns:5px 1fr;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
.tier{background:var(--ice)}
.tier.t1{background:var(--good)}.tier.t2{background:var(--warn)}.tier.t3{background:var(--accent)}.tier.t4{background:var(--far)}
.cbody{padding:.85rem .95rem;display:flex;flex-wrap:wrap;gap:.35rem .75rem;align-items:baseline}
.date{font-family:var(--mono);font-size:1.05rem;font-weight:700;letter-spacing:-.02em}
.rink{font-family:var(--sans);font-weight:700;font-size:1.05rem}
.chip{font-family:var(--sans);font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);border-radius:100px;padding:.13rem .5rem;color:var(--ink3);white-space:nowrap}
.chip.tbc{border-color:var(--warn);color:var(--warn)}
.chip.drive{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--ink2)}
.pin{font-family:var(--sans);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);text-decoration:none;border:1px solid var(--line2);border-radius:100px;padding:.13rem .5rem;white-space:nowrap}
.pin:hover{border-color:var(--accent);color:var(--accent)}
.mdiv{display:flex;align-items:baseline;gap:.75rem;margin-top:.9rem}
.mdiv:first-child{margin-top:0}
.mdiv .mname{font-family:var(--sans);font-weight:800;font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase}
.mdiv .mrule{flex:1;height:2px;background:var(--line)}
.mdiv .mcount{font-family:var(--mono);font-size:.75rem;color:var(--ink3);white-space:nowrap}
.card.showcase{grid-template-columns:8px 1fr;border:1px solid var(--accent);background:linear-gradient(120deg,var(--accentWash),var(--panel) 65%);box-shadow:0 2px 8px var(--shadow)}
.card.showcase .tier{background:linear-gradient(180deg,var(--accent),var(--far))}

.chip.count{border-color:var(--accent);color:var(--accent2);font-family:var(--mono);letter-spacing:0;text-transform:none}
.roadtrip{font-family:var(--sans);font-size:.85rem;color:var(--ink2);flex-basis:100%}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.tab{font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);border:1px solid var(--line2);border-radius:100px;padding:.45rem .85rem;cursor:pointer;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:.7rem}
.shopcard{display:flex;flex-direction:column;gap:.3rem;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.85rem .95rem;text-decoration:none;color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.shopcard:hover{border-color:var(--accent)}
.shopcard .sn{font-family:var(--sans);font-weight:700}
.shopcard .sd{font-size:.85rem;color:var(--ink2);line-height:1.45}
.shopcard .su{font-family:var(--mono);font-size:.72rem;color:var(--accent2)}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.7rem}
.drill{display:flex;flex-direction:column;gap:.35rem;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.9rem .95rem;box-shadow:0 1px 2px var(--shadow)}
.drill .dn{font-family:var(--sans);font-weight:700;display:flex;gap:.5rem;align-items:baseline}
.drill .dnum{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--accent2);border:1px solid var(--line2);border-radius:100px;padding:.05rem .45rem}
.drill .dd{font-size:.9rem;color:var(--ink2);line-height:1.5}
.trlead{font-family:var(--sans);font-size:.95rem;color:var(--ink2);border-left:3px solid var(--accent);padding-left:.75rem}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:.4rem;flex-wrap:wrap;background:var(--ground);padding:.65rem 0;border-bottom:2px solid var(--line);margin:0 -0.25rem;padding-left:.25rem;padding-right:.25rem}
.assign{flex-basis:100%;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding-top:.35rem;border-top:1px dashed var(--line)}
.who{font-family:var(--sans);font-weight:700;font-size:.92rem;color:var(--ink3);font-style:italic}
.who.set{color:var(--good);font-style:normal}
.togs{display:flex;gap:.4rem;flex-wrap:wrap}
.famtog{font-family:var(--sans);font-size:.85rem;font-weight:700;color:var(--ink3);background:var(--sunk);border:1px solid var(--line2);border-radius:999px;padding:.32rem .75rem;cursor:pointer;line-height:1.2}
.famtog:hover{border-color:var(--ink3)}
.famtog.on{color:var(--ground);background:var(--good);border-color:var(--good)}
.famtog:disabled{opacity:.5;cursor:wait}
.claimnote{font-family:var(--sans);font-size:.75rem;color:var(--ink3)}
.nav .tab{font-size:.82rem;padding:.5rem .9rem}
.view[hidden]{display:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:26rem}
th{text-align:left;font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:.4rem .6rem .4rem 0;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:.5rem .6rem .5rem 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.muted{color:var(--ink2);font-size:.92rem}
.tiny{font-size:.78rem;color:var(--ink3);font-family:var(--sans)}
footer{border-top:1px solid var(--line);padding-top:1rem;font-size:.85rem;color:var(--ink3);font-family:var(--sans)}
a{color:var(--accent2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function renderTrain(cat){
  var tabs=document.getElementById("traintabs"),panel=document.getElementById("trainpanel"),lead=document.getElementById("trlead");
  var names=Object.keys(TRAIN),th="";
  for(var i=0;i<names.length;i++){
    th+='<button class="tab" role="tab" aria-selected="'+(names[i]===cat)+'" data-tcat="'+esc(names[i])+'">'+esc(names[i])+'</button>';
  }
  tabs.innerHTML=th;
  lead.textContent=TRAIN[cat].lead;
  var items=TRAIN[cat].items,ph="";
  for(var j=0;j<items.length;j++){
    var it=items[j];
    ph+='<div class="drill"><span class="dn"><span class="dnum">'+(j+1)+'</span>'+esc(it.n)+'</span><span class="dd">'+esc(it.d)+'</span></div>';
  }
  panel.innerHTML=ph;
}
document.getElementById("traintabs").addEventListener("click",function(e){
  var b=e.target.closest("[data-tcat]");
  if(b) renderTrain(b.getAttribute("data-tcat"));
});
renderTrain(Object.keys(TRAIN)[0]);
